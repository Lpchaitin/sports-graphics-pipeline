name: Deploy to Orb Analytics Site

on:
  workflow_run:
    workflows: ["Generate MLB Graphics"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Workflow run number to deploy (leave blank for most recent)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Find run ID for manual trigger ──
      - name: Find workflow run for manual trigger
        if: github.event_name == 'workflow_dispatch'
        id: find_run
        run: |
          RUN_INPUT="${{ inputs.run_number }}"

          if [ -z "$RUN_INPUT" ]; then
            echo "No run number provided, finding most recent successful run..."

            RUN_DATA=$(gh run list --workflow="Generate MLB Graphics" \
              --json databaseId,number,conclusion,status \
              --limit 10 | \
              jq -r '.[] | select(.conclusion=="success") | "\(.databaseId),\(.number)"' | \
              head -1)

            if [ -z "$RUN_DATA" ]; then
              echo "Error: No successful workflow runs found"
              exit 1
            fi

            RUN_ID=$(echo "$RUN_DATA" | cut -d',' -f1)
            RUN_NUMBER=$(echo "$RUN_DATA" | cut -d',' -f2)
            echo "Found most recent successful run: #$RUN_NUMBER (ID: $RUN_ID)"
          else
            echo "Using specified run number: $RUN_INPUT"

            RUN_DATA=$(gh run list --workflow="Generate MLB Graphics" \
              --json databaseId,number,conclusion \
              --limit 100 | \
              jq -r ".[] | select(.number==$RUN_INPUT) | \"\(.databaseId),\(.number)\"")

            if [ -z "$RUN_DATA" ]; then
              echo "Error: No workflow run found with number $RUN_INPUT"
              exit 1
            fi

            RUN_ID=$(echo "$RUN_DATA" | cut -d',' -f1)
            RUN_NUMBER=$(echo "$RUN_DATA" | cut -d',' -f2)
            echo "Found run #$RUN_NUMBER (ID: $RUN_ID)"
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "run_number=$RUN_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Download prediction graphics (manual trigger) ──
      - name: Download prediction graphics (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: mlb-predictions-${{ steps.find_run.outputs.run_number }}
          path: site-output/graphics/mlb/predictions
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Download results graphics (manual trigger) ──
      - name: Download results graphics (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: mlb-results-${{ steps.find_run.outputs.run_number }}
          path: site-output/graphics/mlb/results
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Download prediction graphics (automatic trigger) ──
      - name: Download prediction graphics (automatic)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: mlb-predictions-${{ github.event.workflow_run.run_number }}
          path: site-output/graphics/mlb/predictions
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Download results graphics (automatic trigger) ──
      - name: Download results graphics (automatic)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: mlb-results-${{ github.event.workflow_run.run_number }}
          path: site-output/graphics/mlb/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Verify graphics were downloaded ──
      - name: Verify downloads
        id: verify
        run: |
          PRED_COUNT=$(ls site-output/graphics/mlb/predictions/*.png 2>/dev/null | wc -l || echo 0)
          RES_COUNT=$(ls site-output/graphics/mlb/results/*.png 2>/dev/null | wc -l || echo 0)
          TOTAL=$((PRED_COUNT + RES_COUNT))

          echo "pred_count=$PRED_COUNT" >> $GITHUB_OUTPUT
          echo "res_count=$RES_COUNT"   >> $GITHUB_OUTPUT
          echo "total=$TOTAL"           >> $GITHUB_OUTPUT

          echo "Prediction graphics: $PRED_COUNT"
          echo "Results graphics:    $RES_COUNT"
          echo "Total:               $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ Warning: No graphics found. Continuing anyway to update manifest."
          fi

      # ── Checkout the orb-analytics website repo ──
      - name: Checkout orb-analytics site
        uses: actions/checkout@v4
        with:
          repository: Lpchaitin/orb-analytics
          token: ${{ secrets.ORB_DEPLOY_TOKEN }}
          path: orb-analytics

      # ── Copy graphics into the correct folders ──
      - name: Copy graphics to site repo
        run: |
          mkdir -p orb-analytics/graphics/mlb

          if ls site-output/graphics/mlb/predictions/*.png 2>/dev/null; then
            cp site-output/graphics/mlb/predictions/*.png orb-analytics/graphics/mlb/
            echo "✓ Copied ${{ steps.verify.outputs.pred_count }} prediction graphics"
          else
            echo "No prediction graphics to copy"
          fi

          if ls site-output/graphics/mlb/results/*.png 2>/dev/null; then
            cp site-output/graphics/mlb/results/*.png orb-analytics/graphics/mlb/
            echo "✓ Copied ${{ steps.verify.outputs.res_count }} results graphics"
          else
            echo "No results graphics to copy"
          fi

      # ── Build manifest.json ──
      - name: Generate manifest.json
        run: |
          TODAY=$(date +%Y-%m-%d)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)

          # Build JSON arrays of filenames
          PRED_FILES=$(ls site-output/graphics/mlb/predictions/*.png 2>/dev/null \
            | xargs -I{} basename {} \
            | jq -R . | jq -s . || echo "[]")

          RES_FILES=$(ls site-output/graphics/mlb/results/*.png 2>/dev/null \
            | xargs -I{} basename {} \
            | jq -R . | jq -s . || echo "[]")

          cat > orb-analytics/manifest.json << EOF
          {
            "today": "$TODAY",
            "yesterday": "$YESTERDAY",
            "mlb": {
              "graphics_today": $PRED_FILES,
              "graphics_yesterday": $RES_FILES
            },
            "nba": {
              "graphics_today": [],
              "graphics_yesterday": []
            },
            "nfl": {
              "graphics_today": [],
              "graphics_yesterday": []
            }
          }
          EOF

          echo "✓ manifest.json generated:"
          cat orb-analytics/manifest.json

      # ── Copy the CSV predictions file ──
      - name: Copy CSV predictions to site repo
        run: |
          mkdir -p orb-analytics/data
          TODAY=$(date +%Y-%m-%d)

          # Find the most recently archived CSV
          LATEST_CSV=$(ls -t incoming_picks/processed/*.csv 2>/dev/null | head -1)

          if [ -n "$LATEST_CSV" ]; then
            cp "$LATEST_CSV" "orb-analytics/data/mlb_predictions_${TODAY}.csv"
            echo "✓ Copied CSV → mlb_predictions_${TODAY}.csv"
          else
            echo "No processed CSV found to copy"
          fi

      # ── Commit and push to orb-analytics ──
      - name: Commit and push to orb-analytics
        run: |
          cd orb-analytics
          git config user.name "Orb Pipeline Bot"
          git config user.email "actions@github.com"

          git add graphics/mlb/ data/ manifest.json

          if git diff --staged --quiet; then
            echo "Nothing new to commit — site already up to date"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "Auto-deploy: MLB graphics + predictions for $TODAY"
            git push
            echo "✓ Pushed to orb-analytics successfully"
          fi

      # ── Summary ──
      - name: Summary
        run: |
          echo "## Site Deployed! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟣 Prediction graphics | ${{ steps.verify.outputs.pred_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Results graphics | ${{ steps.verify.outputs.res_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 manifest.json | Updated |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Trigger: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Automatic (after Generate MLB Graphics)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live at:** https://lpchaitin.github.io/orb-analytics/" >> $GITHUB_STEP_SUMMARY