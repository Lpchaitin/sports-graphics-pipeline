name: Generate MLB Graphics

on:
  push:
    paths:
      - 'incoming_picks/*.csv'
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'CSV file to process (e.g., incoming_picks/picks.csv)'
        required: false
        default: 'incoming_picks/*.csv'

jobs:
  generate-graphics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Find CSV files
        id: find_csv
        run: |
          # Find all CSV files in incoming_picks directory
          csv_files=$(ls incoming_picks/*.csv 2>/dev/null || echo "")
          if [ -z "$csv_files" ]; then
            echo "No CSV files found in incoming_picks/"
            exit 1
          fi
          echo "Found CSV files:"
          echo "$csv_files"
          
          # Count files for output
          csv_count=$(echo "$csv_files" | wc -w)
          echo "csv_count=$csv_count" >> $GITHUB_OUTPUT
      
      - name: Convert predictions format
        run: |
          # Convert each predictions file to graphics format
          for csv_file in incoming_picks/*.csv; do
            if [ -f "$csv_file" ]; then
              echo "Converting $csv_file..."
              
              # Convert predictions to graphics format
              python convert_predictions.py "$csv_file" --output "${csv_file%.csv}_converted.csv"
              
              echo "✓ Converted $csv_file"
            fi
          done
      
      - name: Generate graphics
        run: |
          mkdir -p output/mlb/predictions
          mkdir -p output/mlb/results
          
          # Process each converted CSV file
          for csv_file in incoming_picks/*_converted.csv; do
            if [ -f "$csv_file" ]; then
              echo "Processing $csv_file..."
              
              # Check if this CSV has results (ml_result column with non-empty values)
              has_results=$(python -c "
import csv
import sys
with open('$csv_file', 'r') as f:
    reader = csv.DictReader(f)
    for row in reader:
        if row.get('ml_result', '').strip():
            print('true')
            sys.exit(0)
print('false')
              ")
              
              if [ "$has_results" = "true" ]; then
                echo "  → Detected results data, generating results graphics"
                
                # Generate results graphics
                python process_picks.py "$csv_file" \
                  --output-dir "output/mlb/results" \
                  --label "MLB $(date +%Y) | RESULTS" \
                  --branding "ORBANALYTICS.SUBSTACK.COM" \
                  --card-type "results"
                
                echo "  ✓ Generated results graphics from $csv_file"
              else
                echo "  → No results data, generating prediction graphics"
                
                # Generate prediction graphics
                python process_picks.py "$csv_file" \
                  --output-dir "output/mlb/predictions" \
                  --label "MLB $(date +%Y) | TODAY'S PICKS" \
                  --branding "ORBANALYTICS.SUBSTACK.COM" \
                  --card-type "prediction"
                
                echo "  ✓ Generated prediction graphics from $csv_file"
              fi
            fi
          done
      
      - name: Archive CSV (move to processed)
        run: |
          mkdir -p incoming_picks/processed
          for csv_file in incoming_picks/*.csv; do
            if [ -f "$csv_file" ]; then
              # Skip already converted files
              if [[ "$csv_file" == *"_converted.csv" ]]; then
                rm "$csv_file"  # Remove converted files
                continue
              fi
              
              filename=$(basename "$csv_file")
              timestamp=$(date +%Y%m%d_%H%M%S)
              mv "$csv_file" "incoming_picks/processed/${timestamp}_${filename}"
              echo "Archived $csv_file"
            fi
          done
      
      - name: Upload prediction graphics as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-predictions-${{ github.run_number }}
          path: output/mlb/predictions/*.png
          retention-days: 90
          if-no-files-found: ignore
      
      - name: Upload results graphics as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-results-${{ github.run_number }}
          path: output/mlb/results/*.png
          retention-days: 90
          if-no-files-found: ignore
      
      - name: Commit processed CSVs (archive only)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Only commit archived CSVs, not graphics (graphics in artifacts)
          git add incoming_picks/processed/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No CSVs to archive"
          else
            git commit -m "Archive processed predictions for $(date +%Y-%m-%d)"
            git push
            echo "✓ Archived processed CSVs"
          fi
      
      - name: Summary
        run: |
          echo "## Graphics Generation Complete! 🎨" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Graphics generated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Graphics:" >> $GITHUB_STEP_SUMMARY
          echo "Scroll down to **Artifacts** section below:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check what was generated
          pred_count=$(ls output/mlb/predictions/*.png 2>/dev/null | wc -l)
          res_count=$(ls output/mlb/results/*.png 2>/dev/null | wc -l)
          
          if [ "$pred_count" -gt 0 ]; then
            echo "- **mlb-predictions-${{ github.run_number }}.zip** — $pred_count prediction graphics" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$res_count" -gt 0 ]; then
            echo "- **mlb-results-${{ github.run_number }}.zip** — $res_count results graphics" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Predictions Generated:" >> $GITHUB_STEP_SUMMARY
          if [ "$pred_count" -gt 0 ]; then
            ls -lh output/mlb/predictions/*.png 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "No prediction graphics generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Results Generated:" >> $GITHUB_STEP_SUMMARY
          if [ "$res_count" -gt 0 ]; then
            ls -lh output/mlb/results/*.png 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results graphics generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Graphics are available as artifacts for 90 days (not committed to repo)" >> $GITHUB_STEP_SUMMARY
