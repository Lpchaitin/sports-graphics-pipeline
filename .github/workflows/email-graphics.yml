name: Email Graphics After Generation

on:
  workflow_run:
    workflows: ["Generate MLB Graphics"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      date:
        description: 'Date of graphics to send (YYYYMMDD format, e.g., 20260419)'
        required: true
        type: string

jobs:
  email-graphics:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Find artifact for manual trigger
        if: github.event_name == 'workflow_dispatch'
        id: find_artifact
        run: |
          DATE_INPUT="${{ inputs.date }}"
          echo "Looking for artifacts containing graphics from date: $DATE_INPUT"
          
          # Find recent successful workflow runs with artifacts using GitHub API
          FOUND=false
          
          for RUN_DATA in $(gh run list --workflow="Generate MLB Graphics" --json databaseId,number,conclusion --limit 50 | \
            jq -c '.[] | select(.conclusion=="success")'); do
            
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.databaseId')
            RUN_NUMBER=$(echo "$RUN_DATA" | jq -r '.number')
            
            echo "Checking run ID: $RUN_ID (run #$RUN_NUMBER)"
            
            # Use GitHub API to list artifacts for this run
            ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name | startswith("mlb-graphics")) | .name')
            
            if [ -n "$ARTIFACTS" ]; then
              for ARTIFACT in $ARTIFACTS; do
                echo "Found artifact: $ARTIFACT in run $RUN_ID"
                echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
                echo "artifact_name=$ARTIFACT" >> $GITHUB_OUTPUT
                FOUND=true
                break 2
              done
            fi
          done
          
          if [ "$FOUND" = false ]; then
            echo "Error: No artifacts found in recent workflow runs"
            echo "Make sure graphics have been generated at least once"
            exit 1
          fi
          
          echo "Will download artifact: $ARTIFACT from run: $RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download prediction graphics
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('mlb-predictions-{0}', github.event.workflow_run.run_number) }}
          path: graphics-to-email/predictions
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Download results graphics
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('mlb-results-{0}', github.event.workflow_run.run_number) }}
          path: graphics-to-email/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Filter graphics by date (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          DATE_INPUT="${{ inputs.date }}"
          echo "Manual trigger not yet updated for new artifact structure"
          echo "TODO: Update manual trigger logic"
          exit 1
      
      - name: List downloaded graphics
        if: github.event_name != 'workflow_dispatch'
        id: list_graphics
        run: |
          echo "Graphics downloaded:"
          
          # Count predictions
          PRED_COUNT=$(ls graphics-to-email/predictions/*.png 2>/dev/null | wc -l || echo 0)
          echo "Predictions: $PRED_COUNT"
          ls -lh graphics-to-email/predictions/ 2>/dev/null || echo "No predictions"
          
          # Count results
          RES_COUNT=$(ls graphics-to-email/results/*.png 2>/dev/null | wc -l || echo 0)
          echo "Results: $RES_COUNT"
          ls -lh graphics-to-email/results/ 2>/dev/null || echo "No results"
          
          TOTAL=$((PRED_COUNT + RES_COUNT))
          echo "count=$TOTAL" >> $GITHUB_OUTPUT
          echo "pred_count=$PRED_COUNT" >> $GITHUB_OUTPUT
          echo "res_count=$RES_COUNT" >> $GITHUB_OUTPUT
          
          # Get date from first filename
          FIRST_FILE=$(find graphics-to-email -name "*.png" 2>/dev/null | head -1 | xargs basename)
          if [ -n "$FIRST_FILE" ]; then
            DATE_STR=$(echo $FIRST_FILE | cut -d'_' -f1)
            echo "date=$DATE_STR" >> $GITHUB_OUTPUT
          else
            echo "date=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Create email body
        if: github.event_name != 'workflow_dispatch'
        run: |
          cat > email-body.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
              .header { background-color: #0E3386; color: white; padding: 20px; text-align: center; }
              .content { padding: 20px; }
              .footer { background-color: #f4f4f4; padding: 10px; text-align: center; font-size: 12px; color: #666; }
              .stats { background-color: #f9f9f9; padding: 15px; border-left: 4px solid #0E3386; margin: 20px 0; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>🎨 MLB Graphics Ready!</h1>
            </div>
            <div class="content">
              <h2>Graphics Generated Successfully</h2>
              <p>Your MLB graphics for <strong>${{ steps.list_graphics.outputs.date }}</strong> have been generated!</p>
              
              <div class="stats">
                <strong>📊 Summary:</strong><br>
                <strong>🟣 Predictions:</strong> ${{ steps.list_graphics.outputs.pred_count }} graphics (today's picks)<br>
                <strong>🎯 Results:</strong> ${{ steps.list_graphics.outputs.res_count }} graphics (yesterday's outcomes)<br>
                <strong>📈 Total:</strong> ${{ steps.list_graphics.outputs.count }} graphics<br>
              </div>
              
              <p><strong>🟣 Prediction Graphics (Purple):</strong></p>
              <ul>
                <li>Today's picks highlighted in purple</li>
                <li>Ready to share before games start</li>
              </ul>
              
              <p><strong>🎯 Results Graphics (Green/Red):</strong></p>
              <ul>
                <li>✅ Correct picks highlighted in green</li>
                <li>❌ Incorrect picks highlighted in red</li>
                <li>Share as results/recap after games complete</li>
              </ul>
              
              <p><strong>All Graphics Include:</strong></p>
              <ul>
                <li>1080×1350 format (Instagram-ready 4:5 ratio)</li>
                <li>Team colors and white-outlined logos</li>
                <li>Moneyline and O/U data</li>
              </ul>
              
              <p><strong>Next Steps:</strong></p>
              <ol>
                <li>Download the attached PNG files</li>
                <li>Post predictions before games start</li>
                <li>Post results after games complete</li>
                <li>Share on Instagram, Twitter, Substack, etc.</li>
              </ol>
            </div>
            <div class="footer">
              <p>Automated by MLB Graphics Pipeline | Generated via GitHub Actions</p>
            </div>
          </body>
          </html>
          EOF
      
      - name: Send email with graphics
        if: github.event_name != 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "MLB Graphics Ready - ${{ steps.list_graphics.outputs.date }} (${{ steps.list_graphics.outputs.pred_count }} predictions, ${{ steps.list_graphics.outputs.res_count }} results)"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.GMAIL_USERNAME }}
          html_body: file://email-body.html
          attachments: graphics-to-email/**/*.png
          priority: normal
      
      - name: Summary
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "## Email Sent Successfully! 📧" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sent ${{ steps.list_graphics.outputs.count }} graphics to: ${{ secrets.EMAIL_RECIPIENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Date: ${{ steps.list_graphics.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Graphics Breakdown:" >> $GITHUB_STEP_SUMMARY
          echo "- 🟣 **Predictions:** ${{ steps.list_graphics.outputs.pred_count }} graphics" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **Results:** ${{ steps.list_graphics.outputs.res_count }} graphics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Triggered automatically after graphics generation" >> $GITHUB_STEP_SUMMARY
